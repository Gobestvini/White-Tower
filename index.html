<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>White Tower — эталонное поле</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">White Tower</h1>
      <canvas aria-label="White Tower game board"></canvas>
      <div id="hud" class="hud" aria-label="Game controls"></div>
      <p id="status" class="visually-hidden" role="status">Готово</p>
      <section id="load-error" class="load-error" role="alert" hidden>
        <p>Could not load White Tower content. Check the connection and retry.</p>
        <button type="button" onclick="location.reload()">Retry</button>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
